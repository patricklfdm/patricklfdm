<svg xmlns="http://www.w3.org/2000/svg" width="800" height="822" viewBox="0 0 800 822" role="img" aria-labelledby="title desc">
<title id="title">General Search Engine conceptual architecture</title>
<desc id="desc">Queries read immutable snapshots; a single writer publishes updates. Optional WAL and checkpoints provide durability. Optional v5.1 replication uses a fixed three-voter group with a leader.</desc>
<defs><linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#152337"/><stop offset="1" stop-color="#0B1220"/></linearGradient></defs>
<rect width="800" height="822" rx="18" fill="url(#surface)"/>
<rect x="0.5" y="0.5" width="799" height="821" rx="18" fill="none" stroke="#28445C"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="32" y="44" fill="#7DD3FC" font-size="22" font-weight="600" >GSE / CONCEPTUAL ARCHITECTURE</text><text x="32" y="80" fill="#B6C6D9" font-size="21" font-weight="400" >Search core with optional durability and replication</text><rect x="32" y="110" width="736" height="72" rx="12" fill="#152337" stroke="#28445C"/><text x="56" y="155" fill="#F8FAFC" font-size="27" font-weight="600" >Typed filters + full-text queries + BM25</text><path d="M400 182 L400 216" stroke="#7DD3FC" stroke-width="2" fill="none"/><text x="420" y="207" fill="#B6C6D9" font-size="18" font-weight="400" >read</text><rect x="32" y="216" width="736" height="72" rx="12" fill="#152337" stroke="#28445C"/><text x="56" y="262" fill="#F8FAFC" font-size="27" font-weight="600" >Immutable search snapshots</text><path d="M400 288 L400 326" stroke="#34D399" stroke-width="2" fill="none"/><text x="420" y="315" fill="#B6C6D9" font-size="18" font-weight="400" >publish</text><rect x="32" y="326" width="736" height="72" rx="12" fill="#152337" stroke="#28445C"/><text x="56" y="372" fill="#F8FAFC" font-size="27" font-weight="600" >Single writer / batched mutations</text><path d="M400 398 L400 436" stroke="#34D399" stroke-width="2" fill="none"/><rect x="32" y="436" width="736" height="94" rx="12" fill="#152337" stroke="#28445C"/><text x="56" y="475" fill="#7DD3FC" font-size="18" font-weight="600" >OPTIONAL DURABILITY</text><text x="56" y="508" fill="#F8FAFC" font-size="24" font-weight="400" >Write-ahead log + checkpoints + recovery</text><path d="M400 530 L400 564" stroke="#34D399" stroke-width="2" fill="none"/><rect x="32" y="564" width="736" height="152" rx="12" fill="#152337" stroke="#28445C"/><text x="56" y="601" fill="#7DD3FC" font-size="18" font-weight="600" >OPTIONAL REPLICATION / v5.1</text><path d="M150 650 L400 650" stroke="#28445C" stroke-width="1" fill="none"/><path d="M400 650 L650 650" stroke="#28445C" stroke-width="1" fill="none"/><circle cx="150" cy="650" r="13" fill="#0B1220" stroke="#7DD3FC" stroke-width="2"/><circle cx="150" cy="650" r="4" fill="#7DD3FC"/><text x="150" y="690" fill="#B6C6D9" font-size="19" font-weight="400" text-anchor="middle">Voter 1</text><circle cx="400" cy="650" r="13" fill="#0B1220" stroke="#34D399" stroke-width="2"/><circle cx="400" cy="650" r="4" fill="#34D399"/><text x="400" y="690" fill="#B6C6D9" font-size="19" font-weight="400" text-anchor="middle">Leader / voter 2</text><circle cx="650" cy="650" r="13" fill="#0B1220" stroke="#7DD3FC" stroke-width="2"/><circle cx="650" cy="650" r="4" fill="#7DD3FC"/><text x="650" y="690" fill="#B6C6D9" font-size="19" font-weight="400" text-anchor="middle">Voter 3</text><text x="32" y="755" fill="#B6C6D9" font-size="22" font-weight="400" >Fixed three-voter group · strong reads on the leader</text><text x="32" y="790" fill="#B6C6D9" font-size="18" font-weight="400" >Conceptual layers; not a complete protocol or deployment diagram.</text></g>
